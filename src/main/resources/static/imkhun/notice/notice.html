<p class="section-eyebrow">Schedule &amp; notices</p>
<h2>공지사항</h2>

<div class="notice-section reveal">
    <p class="notice-section-label">강의 시간표</p>

    <div class="timetable-wrap">
        <table class="timetable">
            <thead>
            <tr>
                <th scope="col">시간</th>
                <th scope="col">월</th>
                <th scope="col">화</th>
                <th scope="col">수</th>
                <th scope="col">목</th>
                <th scope="col">금</th>
                <th scope="col">토</th>
                <th scope="col">일</th>
            </tr>
            </thead>
            <tbody id="timetableBody"></tbody>
        </table>
    </div>
    <p class="admin-empty-text" id="timetableEmpty" hidden>아직 등록된 시간표가 없어요.</p>

    <div class="timetable-legend">
        <span><i class="tt-dot tt-dot--korean" aria-hidden="true"></i>한국어</span>
        <span><i class="tt-dot tt-dot--computer" aria-hidden="true"></i>컴퓨터</span>
    </div>
</div>

<div class="notice-section reveal">
    <p class="notice-section-label">강의 시청 (온라인 강좌)</p>
    <p class="notice-section-hint">요일·시간 없이, 등록된 기간 동안 언제든 자유롭게 들을 수 있는 강좌예요.</p>

    <p class="admin-empty-text" id="onlineCoursesEmpty" hidden>아직 등록된 온라인 강좌가 없어요.</p>
    <div class="online-course-list" id="onlineCoursesList"></div>
</div>

<div class="notice-section reveal">
    <p class="notice-section-label">공지 목록</p>

    <p class="admin-empty-text" id="noticeListEmpty" hidden>아직 등록된 공지가 없어요.</p>
    <ul class="notice-list" id="noticeList"></ul>
</div>

<div class="notice-section reveal">
    <p class="notice-section-label">자주 묻는 질문</p>

    <p class="admin-empty-text" id="faqEmpty" hidden>아직 등록된 질문이 없어요.</p>
    <div class="faq-list" id="faqList"></div>
</div>
