<!-- 언어/컴퓨터/영상 탭 -->
<div class="trial-tabs" id="trialTabs" role="tablist" aria-label="무료체험 카테고리">
    <button type="button" class="trial-tab active" data-trial-tab="korean" role="tab" aria-selected="true">한국어</button>
    <button type="button" class="trial-tab" data-trial-tab="english" role="tab" aria-selected="false">영어</button>
    <button type="button" class="trial-tab" data-trial-tab="japanese" role="tab" aria-selected="false">일본어</button>
    <button type="button" class="trial-tab" data-trial-tab="thai" role="tab" aria-selected="false">태국어</button>
    <button type="button" class="trial-tab" data-trial-tab="computer" role="tab" aria-selected="false">컴퓨터</button>
    <button type="button" class="trial-tab" data-trial-tab="video" role="tab" aria-selected="false">영상</button>
</div>

<p class="student-materials-heading" id="trialMaterialsHeading"></p>

<div class="student-materials-columns" aria-hidden="true">
    <span></span>
    <span>자료</span>
    <span>유형</span>
    <span>등록일</span>
</div>

<p class="admin-empty-text" id="trialMaterialsEmpty" hidden>아직 등록된 체험 자료가 없어요.</p>
<div class="student-materials-grid" id="trialMaterialsList"></div>

<!-- 무료체험 자료 보기 창 — 새 탭으로 안 가고, 이 창 안에서만 보여줌(워터마크 포함) -->
<div class="trial-material-modal" id="trialMaterialModal" aria-hidden="true">
    <div class="trial-material-modal-backdrop" data-trial-material-close></div>
    <div class="trial-material-modal-panel" role="dialog" aria-modal="true" aria-labelledby="trialMaterialModalTitle">
        <div class="trial-material-modal-head">
            <h3 id="trialMaterialModalTitle">자료</h3>
            <button type="button" class="trial-material-modal-close" data-trial-material-close aria-label="닫기">
                <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                <span>닫기</span>
            </button>
        </div>
        <div class="trial-material-modal-body">
            <iframe id="trialMaterialFrame" src="" title="무료체험 자료" hidden></iframe>
            <p id="trialMaterialText" class="trial-material-text" hidden></p>
            <div class="trial-material-watermark" id="trialMaterialWatermark" aria-hidden="true"></div>
        </div>
        <p class="trial-material-modal-note">화면 보호를 위해 다운로드·인쇄가 제한되어 있어요. 무단 캡처·배포 시 법적 책임을 질 수 있습니다.</p>
    </div>
</div>
