<div class="student-photo-banner student-photo-banner--fullpage">
    <div class="student-photo-banner-slides">
        <div class="student-photo-banner-slide is-active" style="background-image:url('mypage/images/background1.jpg')"></div>
        <div class="student-photo-banner-slide" style="background-image:url('mypage/images/background2.jpg')"></div>
        <div class="student-photo-banner-slide" style="background-image:url('mypage/images/background3.jpg')"></div>
    </div>
    <div class="student-photo-banner-dots">
        <button type="button" class="student-photo-banner-dot is-active" data-slide-index="0" aria-label="배경 사진 1"></button>
        <button type="button" class="student-photo-banner-dot" data-slide-index="1" aria-label="배경 사진 2"></button>
        <button type="button" class="student-photo-banner-dot" data-slide-index="2" aria-label="배경 사진 3"></button>
    </div>

    <div class="mypage-bg-inner">
        <div class="student-mypage-hero">
            <span class="student-home-hero-blob student-home-hero-blob--a" aria-hidden="true"></span>
            <span class="student-home-hero-blob student-home-hero-blob--b" aria-hidden="true"></span>
            <p class="eyebrow student-page-banner-eyebrow">My Page</p>
            <h2 class="student-mypage-title" id="mypageGreeting">안녕하세요!</h2>
            <p class="student-mypage-sub">내 수강 정보를 확인할 수 있어요.</p>
        </div>

        <div class="mypage-frosted-card">
            <nav class="mypage-tabs" role="tablist" aria-label="마이페이지 메뉴">
                <button type="button" class="mypage-tab active" data-mypage-tab="courses" role="tab" aria-selected="true">내 수강 정보</button>
                <button type="button" class="mypage-tab" data-mypage-tab="assignments" role="tab" aria-selected="false">숙제</button>
                <button type="button" class="mypage-tab" data-mypage-tab="classchange" role="tab" aria-selected="false">수업 변경 요청</button>
                <button type="button" class="mypage-tab" data-mypage-tab="myposts" role="tab" aria-selected="false">내가 쓴 글</button>
                <button type="button" class="mypage-tab" data-mypage-tab="shortcuts" role="tab" aria-selected="false">바로가기</button>
            </nav>

            <div class="mypage-tab-panel active" data-mypage-panel="courses">
                <div class="student-home-courses" id="mypageCourses"></div>
            </div>

            <div class="mypage-tab-panel" data-mypage-panel="assignments" hidden>
                <p class="admin-empty-text" id="mypageAssignmentsEmpty" hidden>아직 받은 숙제가 없어요.</p>
                <div class="mypage-assignment-list" id="mypageAssignmentsList"></div>
            </div>

            <div class="mypage-tab-panel" data-mypage-panel="classchange" hidden>
                <p class="admin-note-hint">수업을 못 가게 됐거나 다른 날로 옮기고 싶으면 여기서 요청해주세요. 선생님이 확인하고 답을 남겨드려요.</p>

                <div class="mypage-classchange-form">
                    <div class="mypage-classchange-form-row">
                        <label for="classChangeApplicationSelect">어떤 강의인가요?</label>
                        <select id="classChangeApplicationSelect"></select>
                    </div>
                    <div class="mypage-classchange-form-row">
                        <label>요청 종류</label>
                        <div class="mypage-classchange-type-toggle">
                            <button type="button" class="mypage-classchange-type-btn active" data-change-type="CANCEL">취소</button>
                            <button type="button" class="mypage-classchange-type-btn" data-change-type="RESCHEDULE">변경</button>
                        </div>
                    </div>
                    <div class="mypage-classchange-form-row">
                        <label for="classChangeDateInput">원래 수업 날짜</label>
                        <input type="date" id="classChangeDateInput">
                    </div>
                    <div class="mypage-classchange-form-row" id="classChangeNewDateRow" hidden>
                        <label for="classChangeNewDateInput">희망하는 새 날짜</label>
                        <input type="date" id="classChangeNewDateInput">
                    </div>
                    <div class="mypage-classchange-form-row">
                        <label for="classChangeReasonInput">사유 (선택)</label>
                        <textarea id="classChangeReasonInput" rows="2" placeholder="예: 갑자기 일이 생겨서요"></textarea>
                    </div>
                    <p class="auth-form-error" id="classChangeError" hidden></p>
                    <button type="button" class="mypage-classchange-submit-btn" id="classChangeSubmitBtn">요청 보내기</button>
                </div>

                <p class="admin-empty-text" id="mypageClassChangeEmpty" hidden>아직 보낸 요청이 없어요.</p>
                <div class="mypage-classchange-list" id="mypageClassChangeList"></div>
            </div>

            <div class="mypage-tab-panel" data-mypage-panel="myposts" hidden>
                <p class="admin-empty-text" id="mypagePostsEmpty" hidden>아직 쓴 글이 없어요. 게시판에서 글을 남겨보세요!</p>
                <div class="mypost-list" id="mypagePostsList"></div>
            </div>

            <div class="mypage-tab-panel" data-mypage-panel="shortcuts" hidden>
                <p class="admin-note-hint">선생님이 보내주신 자격증·시험 자료를 여기서 다운로드할 수 있어요.</p>
                <p class="admin-empty-text" id="mypageFilesEmpty" hidden>아직 받은 파일이 없어요.</p>
                <div class="mypage-files-list" id="mypageFilesList"></div>
            </div>
        </div>
    </div>
</div>

<!-- "내 수강 정보" 카드를 누르면 뜨는 자료 목록 오버레이 -->
<div class="course-materials-modal" id="courseMaterialsModal" aria-hidden="true">
    <div class="course-materials-backdrop" data-course-materials-close></div>
    <div class="course-materials-panel" role="dialog" aria-modal="true">
        <div class="course-materials-head">
            <div>
                <p class="course-materials-eyebrow">Materials</p>
                <h3 id="courseMaterialsModalTitle">강의 자료</h3>
            </div>
            <button type="button" class="auth-modal-close" data-course-materials-close aria-label="닫기">
                <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
        </div>
        <div class="course-materials-body" id="courseMaterialsModalBody"></div>
    </div>
</div>
