<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 공부 화면 · I'm Khun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../imkhun/auth/auth.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="korean/korean.css">
    <link rel="stylesheet" href="japanese/japanese.css">
    <link rel="stylesheet" href="thai/thai.css">
    <link rel="stylesheet" href="english/english.css">
    <link rel="stylesheet" href="students/students.css">
    <link rel="stylesheet" href="my/my.css">
</head>
<body class="admin-standalone-body">

<!-- ===================== 로그인 화면 (팝업 아님, 페이지 자체) ===================== -->
<div class="admin-login-page" id="adminLoginPage">
    <div class="admin-login-page-blob admin-login-page-blob--a" aria-hidden="true"></div>
    <div class="admin-login-page-blob admin-login-page-blob--b" aria-hidden="true"></div>

    <div class="admin-login-panel" role="dialog" aria-label="나만의 공부 화면 로그인">
        <div class="admin-login-banner">
            <span class="admin-header-blob admin-header-blob--a" aria-hidden="true"></span>
            <span class="admin-header-blob admin-header-blob--b" aria-hidden="true"></span>
            <span class="admin-login-word">I'm Khun</span>
        </div>

        <div class="admin-login-body">
            <h3>나만의 공부 화면</h3>
            <p class="auth-modal-desc">관리자만 들어올 수 있어요. 이메일, 전화번호, 아이디, 비밀번호를 모두 입력해주세요.</p>

            <div class="auth-form-field">
                <label for="adminLoginEmail">이메일</label>
                <input type="email" id="adminLoginEmail" placeholder="example@email.com" autocomplete="email">
            </div>

            <div class="auth-form-field">
                <label for="adminLoginPhone">전화번호</label>
                <input type="text" id="adminLoginPhone" placeholder="010-0000-0000" autocomplete="tel">
            </div>

            <div class="auth-form-field">
                <label for="adminLoginUsername">아이디</label>
                <input type="text" id="adminLoginUsername" placeholder="아이디 입력" autocomplete="username">
            </div>

            <div class="auth-form-field">
                <label for="adminLoginPassword">비밀번호</label>
                <div class="auth-input-row">
                    <input type="password" id="adminLoginPassword" placeholder="비밀번호 입력" autocomplete="current-password">
                    <button type="button" class="auth-eye-btn" id="toggleAdminLoginPwBtn" aria-label="비밀번호 표시">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
                    </button>
                </div>
            </div>

            <p class="auth-form-error" id="adminLoginError" hidden></p>

            <button type="button" class="auth-form-submit" id="adminLoginSubmitBtn">들어가기</button>
        </div>
    </div>
</div>

<!-- ===================== 나만의 공부 화면 (관리자 전용) ===================== -->
<div class="admin-screen" id="adminScreen" hidden>
    <header class="admin-topheader">
        <span class="admin-topheader-blob admin-topheader-blob--a" aria-hidden="true"></span>
        <span class="admin-topheader-blob admin-topheader-blob--b" aria-hidden="true"></span>

        <div class="admin-topheader-side">
            <button type="button" class="admin-back-btn" id="adminBackBtn">
                <svg viewBox="0 0 24 24" fill="none"><path d="M9 21V13.6c0-.6.4-1 1-1h4c.6 0 1 .4 1 1V21M4.5 10.5 12 4l7.5 6.5M5.5 9.5V20a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1V9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                로그아웃
            </button>
            <span class="admin-topheader-logo">I'm Khun</span>
        </div>

        <span class="admin-topheader-title">나만의 공부 화면</span>

        <div class="admin-topheader-side admin-topheader-side--right">
            <button type="button" class="admin-register-btn" id="adminRegisterBtn">
                <span aria-hidden="true">+</span> 등록하기
            </button>
        </div>
    </header>

    <div class="admin-main-row">
        <aside class="admin-sidebar">
            <nav class="admin-tabs" role="tablist" aria-label="나만의 공부 화면 메뉴">

                <div class="admin-tab-group">
                    <button type="button" class="admin-tab" data-lang-toggle="korean">
                        <span class="admin-tab-icon" aria-hidden="true">가</span>
                        <span class="admin-tab-label">한국어</span>
                        <span class="admin-tab-arrow" data-expand-arrow aria-hidden="true">›</span>
                    </button>
                    <div class="admin-subtabs" data-lang-panel="korean" hidden>
                        <button type="button" class="admin-subtab" data-lang="korean" data-category="GRAMMAR">문법</button>
                        <button type="button" class="admin-subtab" data-lang="korean" data-category="READING">읽기</button>
                        <button type="button" class="admin-subtab" data-lang="korean" data-category="WRITING">쓰기</button>
                        <button type="button" class="admin-subtab" data-lang="korean" data-category="SPEAKING">말하기</button>
                        <button type="button" class="admin-subtab" data-lang="korean" data-category="OTHER">기타</button>
                    </div>
                </div>

                <div class="admin-tab-group">
                    <button type="button" class="admin-tab" data-lang-toggle="japanese">
                        <span class="admin-tab-icon" aria-hidden="true">あ</span>
                        <span class="admin-tab-label">일본어</span>
                        <span class="admin-tab-arrow" data-expand-arrow aria-hidden="true">›</span>
                    </button>
                    <div class="admin-subtabs" data-lang-panel="japanese" hidden>
                        <button type="button" class="admin-subtab" data-lang="japanese" data-category="GRAMMAR">문법</button>
                        <button type="button" class="admin-subtab" data-lang="japanese" data-category="READING">읽기</button>
                        <button type="button" class="admin-subtab" data-lang="japanese" data-category="WRITING">쓰기</button>
                        <button type="button" class="admin-subtab" data-lang="japanese" data-category="SPEAKING">말하기</button>
                        <button type="button" class="admin-subtab" data-lang="japanese" data-category="OTHER">기타</button>
                    </div>
                </div>

                <div class="admin-tab-group">
                    <button type="button" class="admin-tab" data-lang-toggle="thai">
                        <span class="admin-tab-icon" aria-hidden="true">ก</span>
                        <span class="admin-tab-label">태국어</span>
                        <span class="admin-tab-arrow" data-expand-arrow aria-hidden="true">›</span>
                    </button>
                    <div class="admin-subtabs" data-lang-panel="thai" hidden>
                        <button type="button" class="admin-subtab" data-lang="thai" data-category="GRAMMAR">문법</button>
                        <button type="button" class="admin-subtab" data-lang="thai" data-category="READING">읽기</button>
                        <button type="button" class="admin-subtab" data-lang="thai" data-category="WRITING">쓰기</button>
                        <button type="button" class="admin-subtab" data-lang="thai" data-category="SPEAKING">말하기</button>
                        <button type="button" class="admin-subtab" data-lang="thai" data-category="OTHER">기타</button>
                    </div>
                </div>

                <div class="admin-tab-group">
                    <button type="button" class="admin-tab" data-lang-toggle="english">
                        <span class="admin-tab-icon" aria-hidden="true">A</span>
                        <span class="admin-tab-label">영어</span>
                        <span class="admin-tab-arrow" data-expand-arrow aria-hidden="true">›</span>
                    </button>
                    <div class="admin-subtabs" data-lang-panel="english" hidden>
                        <button type="button" class="admin-subtab" data-lang="english" data-category="GRAMMAR">문법</button>
                        <button type="button" class="admin-subtab" data-lang="english" data-category="READING">읽기</button>
                        <button type="button" class="admin-subtab" data-lang="english" data-category="WRITING">쓰기</button>
                        <button type="button" class="admin-subtab" data-lang="english" data-category="SPEAKING">말하기</button>
                        <button type="button" class="admin-subtab" data-lang="english" data-category="OTHER">기타</button>
                    </div>
                </div>

                <button type="button" class="admin-tab" data-direct-tab data-lang="other" data-category="OTHER">
                    <span class="admin-tab-icon" aria-hidden="true">＋</span>
                    <span class="admin-tab-label">기타</span>
                </button>

                <div class="admin-tabs-divider"></div>

                <button type="button" class="admin-tab" data-admin-tab="students" role="tab" aria-selected="false">
          <span class="admin-tab-icon admin-tab-icon--svg" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="8" cy="9" r="2.6" stroke="currentColor" stroke-width="1.5"/><circle cx="16" cy="9" r="2.6" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 19c.9-3 2.7-4.6 5.5-4.6s4.6 1.6 5.5 4.6M11 19c.8-2.7 2.5-4.2 5-4.2s4 1.4 4.8 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
                    <span class="admin-tab-label">학생 관리</span>
                    <span class="admin-tab-arrow" aria-hidden="true">›</span>
                </button>
                <button type="button" class="admin-tab" data-admin-tab="my" role="tab" aria-selected="false">
          <span class="admin-tab-icon admin-tab-icon--svg" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.5"/><path d="M5 19c1.1-3.6 3.6-5.6 7-5.6s5.9 2 7 5.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
                    <span class="admin-tab-label">마이</span>
                    <span class="admin-tab-arrow" aria-hidden="true">›</span>
                </button>
            </nav>
        </aside>

        <div class="admin-body">
            <div class="admin-tab-panel active" id="adminTabMaterials">
                <p class="admin-materials-empty-select">왼쪽에서 언어와 항목(문법/읽기/쓰기/말하기/기타)을 선택해주세요.</p>
                <div class="admin-materials-view" id="adminMaterialsView" hidden>
                    <p class="admin-materials-heading" id="adminMaterialsHeading"></p>
                    <p class="admin-empty-text" id="adminMaterialsEmpty" hidden>아직 등록된 자료가 없어요.</p>
                    <div class="admin-materials-grid" id="adminMaterialsList"></div>
                </div>
            </div>
            <div class="admin-tab-panel" id="adminTabStudents" data-src="students/students.html" hidden></div>
            <div class="admin-tab-panel" id="adminTabMy" data-src="my/my.html" hidden></div>
        </div>
    </div>
</div>

<!-- ===================== 자료 등록 모달 ===================== -->
<div class="admin-register-modal" id="adminRegisterModal" aria-hidden="true">
    <div class="admin-register-backdrop" data-register-close></div>
    <div class="admin-register-panel" role="dialog" aria-modal="true">
        <div class="admin-register-head">
            <h3 id="registerModalTitle">자료 등록</h3>
            <button type="button" class="auth-modal-close admin-register-close" data-register-close aria-label="닫기">
                <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
        </div>

        <div class="admin-register-body">
            <input type="hidden" id="registerEditingId" value="">

            <div class="auth-form-field">
                <label for="registerLanguageSelect">언어</label>
                <select class="apply-select" id="registerLanguageSelect">
                    <option value="korean">한국어</option>
                    <option value="japanese">일본어</option>
                    <option value="thai">태국어</option>
                    <option value="english">영어</option>
                    <option value="other">기타</option>
                </select>
            </div>

            <div class="auth-form-field" id="registerCategoryField">
                <label>항목</label>
                <div class="admin-category-grid">
                    <label class="admin-category-chip">
                        <input type="radio" name="registerCategory" value="GRAMMAR" checked>
                        <span>문법</span>
                    </label>
                    <label class="admin-category-chip">
                        <input type="radio" name="registerCategory" value="READING">
                        <span>읽기</span>
                    </label>
                    <label class="admin-category-chip">
                        <input type="radio" name="registerCategory" value="WRITING">
                        <span>쓰기</span>
                    </label>
                    <label class="admin-category-chip">
                        <input type="radio" name="registerCategory" value="SPEAKING">
                        <span>말하기</span>
                    </label>
                    <label class="admin-category-chip">
                        <input type="radio" name="registerCategory" value="OTHER">
                        <span>기타</span>
                    </label>
                </div>
            </div>

            <div class="auth-form-field">
                <label for="registerTitleInput">제목</label>
                <input type="text" id="registerTitleInput" placeholder="예: 조사 정리, 3과 읽기 지문">
            </div>

            <div class="auth-form-field">
                <label for="registerDescriptionInput">설명 <span class="apply-optional">(선택)</span></label>
                <textarea class="admin-note-textarea admin-register-text" id="registerDescriptionInput" placeholder="이 자료에 대한 간단한 설명을 적어주세요"></textarea>
            </div>

            <div class="auth-form-field">
                <label for="registerFileInput">이미지 또는 파일 <span class="apply-optional">(이미지는 여러 개, 파일은 1개만 · 새로 고르면 기존 것에 추가돼요)</span></label>
                <div class="admin-existing-files" id="registerExistingFiles"></div>
                <input type="file" id="registerFileInput" multiple>
                <p class="admin-note-hint" id="registerFileName"></p>
            </div>

            <div class="auth-form-field">
                <label for="registerLinkInput">링크 <span class="apply-optional">(선택)</span></label>
                <input type="text" id="registerLinkInput" placeholder="https://...">
            </div>

            <div class="auth-form-field">
                <label for="registerTextInput">글 <span class="apply-optional">(선택)</span></label>
                <textarea class="admin-note-textarea admin-register-text" id="registerTextInput" placeholder="바로 여기에 내용을 적어서 등록할 수도 있어요"></textarea>
            </div>

            <p class="auth-form-error" id="registerError" hidden></p>

            <button type="button" class="auth-form-submit" id="registerSubmitBtn">등록하기</button>
        </div>
    </div>
</div>

<!-- ===================== 자료 갤러리로 보기 ===================== -->
<div class="admin-lightbox" id="adminLightbox" aria-hidden="true">
    <div class="admin-lightbox-backdrop" data-lightbox-close></div>
    <button type="button" class="admin-lightbox-close" data-lightbox-close aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>

    <button type="button" class="admin-lightbox-nav admin-lightbox-nav--prev" id="adminLightboxPrev" aria-label="이전">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="admin-lightbox-content">
        <img class="admin-lightbox-img" id="adminLightboxImg" src="" alt="">
        <p class="admin-lightbox-count" id="adminLightboxCount"></p>
    </div>

    <button type="button" class="admin-lightbox-nav admin-lightbox-nav--next" id="adminLightboxNext" aria-label="다음">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
</div>

<script src="app.js"></script>
</body>
</html>
