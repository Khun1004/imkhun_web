<div class="admin-inline-panel active" data-students-panel="applications">
    <div class="admin-materials-head-row">
        <p class="admin-note-hint" style="margin:0;">학생들이 신청한 강의 목록이에요. 확인했으면 승인 처리해주세요.</p>
        <a class="admin-export-btn" href="/api/admin/applications/export" download>
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            엑셀로 내보내기
        </a>
    </div>
    <p class="admin-empty-text" id="adminStudentsEmpty" hidden>아직 신청 내역이 없어요.</p>
    <div class="admin-student-columns" aria-hidden="true">
        <span>학생</span>
        <span>이메일</span>
        <span>강의정보</span>
        <span>연락처</span>
        <span>학생번호</span>
        <span>신청일</span>
        <span>상태</span>
    </div>
    <div id="adminStudentList" class="admin-student-table"></div>
</div>

<div class="admin-inline-panel" data-students-panel="attendance-history" hidden>
    <div class="admin-materials-head-row">
        <p class="admin-note-hint" style="margin:0;">전체 학생의 출석 기록을 최신순으로 보여줘요. 오늘 수업 학생을 빠르게 체크하려면 오른쪽 끝의 "출석 체크" 탭을 눌러주세요.</p>
        <a class="admin-export-btn" href="/api/admin/attendance/export" download>
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 4v11M7 11l5 5 5-5M5 20h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            엑셀로 내보내기
        </a>
    </div>
    <p class="admin-empty-text" id="attendanceHistoryEmpty" hidden>아직 출석 기록이 없어요.</p>
    <div class="admin-attendance-history-table" id="attendanceHistoryTable"></div>
</div>

<div class="admin-inline-panel" data-students-panel="reviews" hidden>
    <p class="admin-note-hint">학생들이 남긴 리뷰예요. 답글을 남기면 리뷰 화면에 같이 보여요.</p>
    <p class="admin-empty-text" id="adminReviewsEmpty" hidden>아직 리뷰가 없어요.</p>
    <div id="adminReviewList"></div>
</div>

<div class="admin-inline-panel" data-students-panel="posts" hidden>
    <p class="admin-note-hint">학생들이 게시판에 쓴 글이에요. 문제가 있는 글은 삭제할 수 있어요.</p>
    <p class="admin-empty-text" id="adminPostsEmpty" hidden>아직 등록된 글이 없어요.</p>
    <div id="adminPostList" class="admin-post-list"></div>
</div>
