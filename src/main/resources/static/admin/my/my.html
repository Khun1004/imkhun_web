<nav class="admin-inline-tabs" role="tablist" aria-label="마이 메뉴">
    <button type="button" class="admin-inline-tab active" data-my-tab="info" role="tab" aria-selected="true">내 정보</button>
    <button type="button" class="admin-inline-tab" data-my-tab="payment" role="tab" aria-selected="false">결제 수단</button>
</nav>

<div class="admin-inline-panel active" data-my-panel="info">
    <section class="admin-my-section">
        <h3>내 정보</h3>
        <div class="admin-my-info-row">
            <span>아이디</span>
            <span id="adminMyUsername">-</span>
        </div>

        <div class="auth-form-field">
            <label for="adminMyEmailInput">이메일</label>
            <input type="email" id="adminMyEmailInput" placeholder="example@email.com">
        </div>

        <div class="auth-form-field">
            <label for="adminMyPhoneInput">전화번호</label>
            <input type="text" id="adminMyPhoneInput" placeholder="010-0000-0000">
        </div>

        <p class="auth-form-error" id="adminInfoError" hidden></p>

        <div class="admin-note-footer">
            <span class="admin-note-updated" id="adminInfoUpdated"></span>
            <button type="button" class="admin-note-save-btn" id="adminInfoSaveBtn">저장</button>
        </div>
    </section>

    <section class="admin-my-section">
        <h3>비밀번호 변경</h3>

        <div class="auth-form-field">
            <label for="adminCurrentPasswordInput">현재 비밀번호</label>
            <input type="password" id="adminCurrentPasswordInput" autocomplete="current-password">
        </div>

        <div class="auth-form-field">
            <label for="adminNewPasswordInput">새 비밀번호 <span class="apply-optional">(8자 이상)</span></label>
            <input type="password" id="adminNewPasswordInput" autocomplete="new-password">
        </div>

        <div class="auth-form-field">
            <label for="adminNewPasswordConfirmInput">새 비밀번호 확인</label>
            <input type="password" id="adminNewPasswordConfirmInput" autocomplete="new-password">
        </div>

        <p class="auth-form-error" id="adminPasswordError" hidden></p>

        <div class="admin-note-footer">
            <span class="admin-note-updated" id="adminPasswordUpdated"></span>
            <button type="button" class="admin-note-save-btn" id="adminPasswordSaveBtn">비밀번호 변경</button>
        </div>
    </section>
</div>

<div class="admin-inline-panel" data-my-panel="payment" hidden>
    <section class="admin-my-section">
        <h3>결제 수단</h3>
        <p class="admin-note-hint">학생들에게 안내할 계좌 정보나 결제 방법을 적어두세요. (은행명, 계좌번호, 예금주 등)</p>
        <textarea class="admin-note-textarea" id="adminPaymentTextarea" placeholder="예: 국민은행 123456-78-901234 (예금주: 쿤산와이)"></textarea>
        <div class="admin-note-footer">
            <span class="admin-note-updated" id="adminPaymentUpdated"></span>
            <button type="button" class="admin-note-save-btn" id="adminPaymentSaveBtn">저장</button>
        </div>
    </section>
</div>
