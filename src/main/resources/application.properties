spring.application.name=imkhun

# MySQL (로컬에 설치된 MySQL 서버로 연결 — SQLyog에서 접속하시던 것과 같은 서버예요)
# 비밀번호는 SQLyog에 저장해두신 그 root 비밀번호를 그대로 넣어주세요
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/imkhundb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234

# 엔티티(User.java) 기준으로 테이블을 자동 생성/수정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- 예전 H2 설정 (혹시 몰라서 주석으로 남겨둠 — MySQL 쓰다가 문제 생기면 이걸로 되돌릴 수 있어요) ----
