spring.application.name=imkhun

# H2 파일 DB (별도 설치 없이 바로 씀 - 프로젝트 폴더 안에 data 폴더가 생기고 거기 저장됨)
spring.datasource.url=jdbc:h2:file:./data/imkhundb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 엔티티(User.java) 기준으로 테이블을 자동 생성/수정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 브라우저에서 DB 내용을 직접 볼 수 있는 콘솔 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile